<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <title>logIn</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>


    <div class="main-img-sm">
          <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login-sm.png?raw=true" alt="鞋子BANNER">
    </div>

    <main class="main-logIn">
  
      <aside class="col-5">
        <div class="layout-area">
        <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login.png?raw=true" alt="鞋子BANNER">
      </div>
      </aside>

      <section class="col-7">

        <div class="logIn-area">
          <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login-bg.png?raw=true" alt="登入底圖">
          <div class="logIn-layout">
            <h1>歡迎!</h1>

            <div class="leable-logIn">
            <div class="leable-logIn-default"><h2>登入</h2></div>
            <div class="leable-logIn-disabled"><h2>註冊</h2></div>
            </div>



            <div class="btn-media-logIn">
          <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/c07852c7f1c21031d6380bb4398e2163f71122c9/2025-week3-4/facebook.svg" alt="FB LOGO">

          <p>Facebook 登入</p>
            </div>

            <div class="btn-media-logIn">
          <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/c07852c7f1c21031d6380bb4398e2163f71122c9/2025-week3-4/apple.svg" alt="APPLE LOGO">

          <p>Apple 登入</p>
            </div>

            <div class="btn-media-logIn">
          <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/c07852c7f1c21031d6380bb4398e2163f71122c9/2025-week3-4/google.svg" alt="GOOGLE LOGO">

          <p>Google 登入</p>
            </div>


          </div>
        </div>

        
      </section>
    </main>







    

















    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
